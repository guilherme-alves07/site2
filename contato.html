<!DOCTYPE html>

<head>

  <title>Contato - Apex Motors</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Apex Motors</h1>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="modelos.html">Modelos</a></li>

        <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Fale Conosco</h2>
      <p>Envie sua mensagem para tirar dúvidas sobre o projeto ou sugerir novos modelos.</p>
      <form action="#" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
        
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
        
        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" rows="4" placeholder="Sua mensagem..." required></textarea>
        
        <button type="submit">Enviar</button>
      </form>
      <img src="image/fundo.jpg" alt="Atendimento ao cliente">
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Apex Motors - Todos os direitos reservados.</p>
  </footer>
</body>
</html>
